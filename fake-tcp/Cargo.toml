[package]
name = "fake-tcp"
version.workspace = true
edition.workspace = true
authors = ["Datong Sun <dndx@idndx.com>"]
license.workspace = true
repository = "https://github.com/dndx/phantun"
readme = "README.md"
description = "A userspace asynchronous TCP stack for packet-oriented tunneling."

[features]
benchmark = []

[dependencies]
bytes = "1"
pnet_packet = "0"
pnet_base = "0"
rand = { version = "0", features = ["small_rng"] }
internet-checksum = "0"
flume = "0"
async-trait = "0.1"
tokio = { workspace = true }
log = { workspace = true }
